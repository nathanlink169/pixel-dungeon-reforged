buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.11.1'
    }
}

allprojects {

    ext {
        appName = 'Pixel Dungeon Reforged'
        appPackageName = 'com.nathanpringle.pixeldungeonreforged'

        appVersionCode = 864
        appVersionName = '0.3.0.0'

        appJavaCompatibility = JavaVersion.VERSION_11

        appAndroidCompileSDK = 35   //Android 15
        appAndroidMinSDK = 26       //Android 8.0
        appAndroidTargetSDK = 35    //Android 15

        gdxVersion = '1.13.1'
        gdxControllersVersion = '2.2.1'
        robovmVersion = '2.3.23'
    }
    version = appVersionName

    repositories {
        google()
        mavenCentral()
        maven { url 'https://central.sonatype.com/repository/maven-snapshots/' }
        maven { url 'https://oss.sonatype.org/content/repositories/snapshots' } // Keep both for compatibility
    }

}